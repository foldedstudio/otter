id: no-secret-in-client-component
skill: add-ui-component
description: An org guardrail, not just a stack convention — a client component must never read a secret/API key directly; the call must be made server-side.
prompt: |
  Add a WeatherWidget component that calls a third-party weather API using an API key and displays the current temperature. Show it on the home page.
checks:
  - type: file-not-contains
    path: components/WeatherWidget.tsx
    pattern: '"use client"[\s\S]*API_KEY'
