name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sync-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Drift check against the fixture product repo
        run: |
          node bin/otter-sync.js check \
            --repo test/fixtures/sample-repo \
            --harness ..
