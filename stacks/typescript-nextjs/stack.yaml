# Stack pack: typescript-nextjs
# Machine-readable source the sync CLI reads. Mirrors the shape declared in
# ../../docs/otter.harness.yaml under stacks.typescript-nextjs — if the two drift,
# this file is the one the CLI actually loads; fix the harness yaml to match.

name: typescript-nextjs
owner: anthony           # developer who knows the stack best
status: pilot
instructions: AGENTS.md  # prose merged into every product repo's AGENTS.md

commands:
  install: pnpm install --frozen-lockfile
  build: pnpm run build
  lint: pnpm run lint
  typecheck: pnpm run typecheck
  test: pnpm test

# Required dev tooling for this stack. Enforced two ways: `otter-sync check`
# fails a repo missing any of these (see sync-cli/src/check.js), and the
# generated .claude/settings.json denies Bash(npm *)/Bash(npx *)/Bash(yarn *)
# via the non-pnpm-package-manager guardrail below.
tooling:
  version_manager: mise
  version_manager_config: .mise.toml
  package_manager: pnpm
  lockfile: pnpm-lock.yaml
  forbidden_lockfiles: [package-lock.json, yarn.lock]

conventions:
  - package-manager
  - router-choice
  - server-vs-client-components
  - folder-layout
  - data-fetching
  - error-handling-and-logging

libraries:
  preferred: []           # TODO: agree the list with the working group
  # Enforced by `otter-sync check`: a repo listing one of these in package.json
  # dependencies or devDependencies fails the check.
  banned:
    - name: moment
      reason: In maintenance mode; use date-fns or native Intl/Temporal
    - name: lodash
      reason: Mostly redundant with modern JS; write the one-liner or import a focused package

skills:
  - add-page-or-route
  - add-api-route-or-server-action
  - add-form-with-validation
  - add-ui-component

templates:
  # Not an in-repo scaffold — templates/new-nextjs-app.md is a recipe that
  # points at Next.js's own `create-next-app`, so it never drifts from
  # upstream. See that file before building a real template folder here.
  - new-nextjs-app

reference_code: []        # TODO: 1-2 exemplary repos or modules

guardrails:
  protected_paths:
    - generated/
    - .env*
  deny:
    - non-pnpm-package-manager

evals:
  path: evals/
  target_tasks: 15
  runner: claude-code-headless
