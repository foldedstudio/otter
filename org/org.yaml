# Organisation layer: machine-readable source the sync CLI loads.
# Mirrors the shape declared in ../docs/otter.harness.yaml under `org` — if the two
# drift, fix the harness yaml to match this file, which is what the CLI reads.

instructions: AGENTS.md   # prose merged into every product repo's AGENTS.md

guardrails:
  deny:
    - production-credentials
    - destructive-commands
    - unapproved-network-access
  require_approval:
    - dependency-installs
    - changes-to-ci-config
    - changes-to-protected-paths
  protected_paths: []       # org has none itself; stacks and repos add their own
  tools_allowlist: [claude-code, codex]
  mcp_servers_allowlist:    # each entry pinned; bump via the upgrade-dependency skill
    - name: github
      source: ghcr.io/github/github-mcp-server
      version: v2.0.2
      purpose: PR and issue access for local dev and read-only CI reviewer agents
    - name: playwright
      source: "@playwright/mcp"
      version: 0.0.83
      purpose: browser-driven UI verification (typescript-nextjs)

guidance:
  principles:
    - Conventional commits; small PRs with a clear description
    - Every change ships with tests or a reason why not
    - Respect the licence policy; no copyleft deps without approval

skills:
  - write-adr
  - open-pr
  - upgrade-dependency
  - incident-writeup
